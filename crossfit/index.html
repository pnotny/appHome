<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>CrossFit Coach</title>
<meta name="description" content="Apple-style CrossFit trenér — inteligentní generátor tréninků na míru." />
<meta name="theme-color" content="#0B0B10" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CF Coach" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="topbar-title">
      <span class="topbar-logo">🏋️</span>
      <div>
        <h1>CrossFit Coach</h1>
        <p id="topbar-subtitle" class="topbar-subtitle">Tvůj denní trénink</p>
      </div>
    </div>
    <button id="theme-toggle" class="icon-btn" title="Přepnout motiv" aria-label="Přepnout motiv">🌗</button>
  </header>

  <main id="screen" class="screen"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab-item active" data-tab="today">
      <span class="tab-icon">📅</span><span>Dnes</span>
    </button>
    <button class="tab-item" data-tab="history">
      <span class="tab-icon">📈</span><span>Historie</span>
    </button>
    <button class="tab-item" data-tab="library">
      <span class="tab-icon">📚</span><span>Cviky</span>
    </button>
    <button class="tab-item" data-tab="profile">
      <span class="tab-icon">👤</span><span>Profil</span>
    </button>
  </nav>

</div>

<!-- Bottom sheet: detail cviku -->
<div id="sheet-exercise" class="sheet-overlay hidden">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-exercise-content"></div>
  </div>
</div>

<!-- Bottom sheet: výměna cviku -->
<div id="sheet-swap" class="sheet-overlay hidden">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-swap-content"></div>
  </div>
</div>

<!-- Modal: export karty -->
<div id="modal-share" class="modal-overlay hidden">
  <div class="modal modal-share">
    <button class="icon-btn modal-close" id="share-close" aria-label="Zavřít">✕</button>
    <div id="share-preview" class="share-preview"></div>
    <div class="modal-actions">
      <button id="share-download" class="btn btn-secondary">⬇️ Stáhnout PNG</button>
      <button id="share-native" class="btn btn-primary">📤 Sdílet</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="data/exercises.js"></script>
<script src="js/storage.js"></script>
<script src="js/generator.js"></script>
<script src="js/share.js"></script>
<script src="js/app.js"></script>
</body>
</html>
